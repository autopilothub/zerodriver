mode: hardware

control:
  loop_hz: 50
  base_speed: 0.6
  corner_speed: 0.3
  corner_threshold: 0.5
  line_lost_speed: 0.2
  esc_arm_delay_sec: 2

pid:
  steering:
    kp: 0.8
    ki: 0.01
    kd: 0.05

obstacle:
  stop_distance_cm: 20
  scan_front_angle: 60

camera:
  width: 320
  height: 240
  roi_y: 160
  line_threshold: 100

hardware:
  i2c_bus: "/dev/i2c-1"
  i2c_addr: 0x68
  lidar_model: rplidar_a1
  lidar_port: "/dev/ttyUSB0"
  lidar_baud: 115200
  camera_device: "/dev/video0"
  pca9685_addr: 0x40
  pca9685_freq_hz: 50
  steering_channel: 0
  throttle_channel: 1
  servo_min_us: 1000
  servo_center_us: 1500
  servo_max_us: 2000
  throttle_min_us: 1000
  throttle_max_us: 2000

telemetry:
  enabled: false
  endpoint: ""
  topic: zerodriver/telemetry
  interval_sec: 1
  cert_dir: /etc/zerodriver/certs
