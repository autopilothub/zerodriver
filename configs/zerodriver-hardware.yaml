mode: hardware

control:
  loop_hz: 50
  base_speed: 0.35
  corner_speed: 0.2
  corner_threshold: 0.5
  line_lost_speed: 0.15
  max_throttle_slew: 0.2
  esc_arm_delay_sec: 2
  pure_pursuit:
    lookahead: 0.35
    gain: 1.0
  imu_fusion:
    heading_kp: 0.03
    yaw_damping: 0.015
    line_lost_heading_kp: 0.06
    heading_lock_offset: 0.15

pid:
  steering:
    kp: 0.8
    ki: 0.01
    kd: 0.05

obstacle:
  stop_distance_cm: 25
  clear_distance_cm: 50
  min_distance_cm: 12
  scan_front_angle: 40

camera:
  width: 320
  height: 240
  roi_y: 160
  lookahead_rows: 40
  line_threshold: 100

hardware:
  i2c_bus: "/dev/i2c-1"
  i2c_addr: 0x4b
  imu_model: bno085
  lidar_enabled: true
  lidar_model: rplidar_a1
  lidar_port: "/dev/ttyUSB0"
  lidar_baud: 115200
  camera_device: "/dev/video0"
  camera_backend: rpicam
  pca9685_addr: 0x40
  pca9685_freq_hz: 50
  steering_channel: 0
  throttle_channel: 1
  servo_min_us: 1000
  servo_center_us: 1500
  servo_max_us: 2000
  servo_trim_us: 0
  steering_invert: false
  throttle_map: bidirectional_inverted
  throttle_neutral_us: 1560       # 중립
  throttle_forward_us: 1000       # 전진 최대 (낮은 펄스)
  throttle_reverse_us: 2000       # 후진 최대 (높은 펄스)
  throttle_min_us: 1000           # 펄스 하한
  throttle_max_us: 2000           # 펄스 상한
  throttle_forward_start_us: 1450 # 전진 데드존 (이보다 낮아야 전진)
  throttle_reverse_start_us: 1800 # 후진 데드존 (이보다 높아야 후진)
  throttle_trim_us: 0

telemetry:
  enabled: false
  endpoint: ""
  topic: zerodriver/telemetry
  interval_sec: 1
  cert_dir: /etc/zerodriver/certs

web:
  enabled: true
  addr: ":8080"
  refresh_ms: 200
  camera_quality: 70
